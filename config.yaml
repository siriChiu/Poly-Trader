database:
  url: sqlite:////home/kazuha/Poly-Trader/poly_trader.db

server:
  allowed_origins:
    - http://127.0.0.1:5173
    - http://localhost:5173
    - http://127.0.0.1:8000
    - http://localhost:8000
    - http://127.0.0.1:9119
    - http://localhost:9119

# Do not commit exchange secrets. Use environment variables instead:
# POLY_TRADER_OKX_API_KEY / POLY_TRADER_OKX_API_SECRET / POLY_TRADER_OKX_PASSPHRASE
# or OKX_API_KEY / OKX_API_SECRET / OKX_PASSPHRASE.
okx:
  api_key: ""
  api_secret: ""
  passphrase: ""

trading:
  symbol: "BTCUSDT"
  confidence_threshold: 0.7
  max_position_ratio: 0.05
  dry_run: true
  venue: "okx"

# Personal project release policy. Statistical sample/support thresholds remain
# visible for audit and uncertainty sizing, but they no longer veto the owner's
# approved strategy. Live adapters still require exact model binding plus every
# technical execution gate (breaker, venue, permit, kill switch, canary caps).
strategy_release:
  mode: "owner_approved_personal_use"
  owner_approval:
    enabled: true
    decision_id: "poly-trader-personal-release-2026-07-19"
    approved_by: "Kazuha"
    selector:
      model: "logistic_regression"
      feature_profile: "current_full"
      regime: "all"
      top_k: "top_1pct"
    statistical_gate_policy: "advisory_with_uncertainty_sizing"
    minimum_full_evidence_trades: 50
    max_layers_until_full_evidence: 1
    runtime_binding:
      # Fail-actionable instead of fail-waiting: strategy release is active now,
      # but runtime must bind the same fitted logistic model/schema/checksum.
      verified: false
      model: "logistic_regression"
      feature_profile: "current_full"
      artifact_path: null
      artifact_sha256: null

live_runner:
  strategy_name: "Auto Leaderboard · 重掃 random_forest Hybrid #01"
  interval_seconds: 300
  capital_quote: 10000
  one_action_per_feature_timestamp: true
  shadow_candidate_enabled: true
  shadow_evidence_mode: true
  one_shadow_candidate_per_feature_timestamp: true
  shadow_candidate_qty: 0.00001
  order_type: "market"

execution:
  mode: "paper"
  venue: "okx"
  enable_live_trading: false
  kill_switch: false
  live_canary:
    enabled: false
    allowed_symbols:
      - "BTC/USDT"
    max_base_qty_by_symbol:
      "BTC/USDT": 0.0001
  cost_aware_edge:
    # Default total threshold = 15 bps. Forecast edge must exceed this before
    # any paper/shadow risk-on candidate is marked ready; live buy/add still
    # requires strict exact support, venue proof, breaker, and canary policy.
    taker_fee_bps: 5
    spread_bps: 3
    slippage_bps: 2
    volatility_buffer_bps: 5
    drawdown_buffer_bps: 0
  venues:
    okx:
      enabled: true
      default_type: "spot"

coinalyze:
  api_key: ""
